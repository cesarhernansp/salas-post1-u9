# dosbox.conf -- Laboratorio Post1 Unidad 9 (DOSBox-X)
# Se inicia con: dosbox-x.exe -conf dosbox.conf

[sdl]
fullscreen=false
windowresolution=800x600
output=surface

[dosbox]
memsize=16

[cpu]
core=normal
cycles=fixed 20000

[autoexec]
# El repositorio se monta como C:\ (asi existen C:\U9P1 y C:\U9P2)
mount c "C:\Users\Cesar\salas-post1-u9"
c:
# nasm.exe (DJGPP) necesita un host DPMI residente
path %PATH%;C:\
cwsdpmi -p > nul
cls
